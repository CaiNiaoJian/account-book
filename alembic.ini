# =============================================================================
# Alembic configuration
# -----------------------------------------------------------------------------
# IMPORTANT: this file is intentionally ASCII-only.
#   configparser reads .ini files with the *locale* encoding (GBK on a Chinese
#   Windows), so non-ASCII comments here crash `alembic revision`. Tool-owned
#   config files stay ASCII; the rationale lives in docs/ARCHITECTURE.md.
#
# Notes
#   * The application does NOT read this file at runtime. It builds the Alembic
#     Config in code (accountbook/db/migrations/__init__.py) and injects the
#     *actual* ledger engine, so migrations can never hit the wrong database.
#   * This file exists so developers can generate revisions from the CLI:
#         .venv\Scripts\python.exe -m alembic revision --autogenerate -m "add xxx"
#     The URL below is a scratch database for that purpose - never point it at
#     a real ledger.
# =============================================================================

[alembic]
script_location = src/accountbook/db/migrations
prepend_sys_path = src
version_path_separator = os
sqlalchemy.url = sqlite+pysqlite:///./.alembic-dev.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
